server:
  host: .\SQLEXPRESS
  auth: windows
  driver: SQL Server Native Client 11.0

answer:
  source: database
  database: HungBinh2024
  version: hung-binh-2024-v1
  strict: true
  query_file: config/answer_queries.yaml
  snapshot_directory: data/answer_snapshots
  transaction_isolation: SERIALIZABLE
  scope:
    start: '2024-01-01'
    end: '2024-12-31'
    branch_id: null
  validation:
    require_scope: true
    require_postings: true
    require_financial_reports: true
    required_workflow_roles:
      - PU_ORDER
      - PU_VOUCHER

# .bak và .mbk đều được xử lý như SQL Server database backup.
# Nếu SQL Server ở máy khác, staging_directory phải là UNC path mà cả tiến
# trình web và tài khoản dịch vụ SQL Server đều có quyền đọc.
answer_restore:
  enabled: true
  staging_directory: data/answer_backups
  source_directory: data/answer_sources
  max_upload_bytes: 21474836480
  keep_backup: true
  set_read_only: true
  # Để null sẽ tự đọc InstanceDefaultDataPath/InstanceDefaultLogPath.
  data_directory: null
  log_directory: null

scoring:
  scale: 10.0
  tolerance: 1.0
  weights:
    inventory_balance: 10.0
    fixed_asset_balance: 5.0
    general_balance: 25.0
    transactions: 55.0
    financial_reports: 5.0
    audit_analysis: 0.0

entity_matching:
  # Mã, tên và GUID không được dùng làm khóa giữa hai database.
  max_anchor_cost: 35.0
  ambiguity_margin: 0.5
  event_tiebreak_weight: 0.20
  event_tiebreak_cap: 25.0
  max_exact_assignment_size: 18

student:
  source: excel
  excel_file: d12.xlsm
  excel_sheet_list: DanhSach
  db_name_pattern: ^\d{8}$

traceability:
  enabled: true
  level: 2

output:
  directory: output
  grade_file: bangdiem_{timestamp}.xlsx
  detail_dir: details
