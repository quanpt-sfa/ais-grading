# =============================================================================
# SQL queries cho hệ thống chấm điểm HTTTKT (MISA SME.NET)
# =============================================================================

# -----------------------------------------------------------------------------
# Dữ liệu tổng hợp tương thích ngược
# -----------------------------------------------------------------------------
inventory_balance:
  description: "Lấy số dư hàng tồn kho mở đầu tổng hợp"
  query: >
    SELECT
      COUNT(*) AS item_count,
      ISNULL(SUM(InwardQuantityBalance), 0) AS total_qty,
      ISNULL(SUM(InwardAmountBalance), 0) AS total_amount
    FROM InventoryLedger
    WHERE UPPER(ISNULL(RefNo, '')) = 'OPN'

fixed_asset_balance:
  description: "Lấy danh sách và số dư tài sản cố định mở đầu"
  query: >
    SELECT
      FixedAssetCode,
      FixedAssetName,
      OrgPrice,
      DepreciationAmount,
      AccumDepreciationAmount,
      LifeTimeInMonth,
      LifeTimeRemainingInMonth
    FROM FixedAsset
    WHERE UPPER(ISNULL(RefNo, '')) = 'OPN'
    ORDER BY FixedAssetCode

general_balance:
  description: "Lấy số dư tài khoản mở đầu tổng hợp"
  query: >
    SELECT
      LEFT(AccountNumber, 3) AS AccountCode,
      ISNULL(SUM(DebitAmount), 0) AS DebitAmount,
      ISNULL(SUM(DebitAmountOC), 0) AS DebitAmountOC,
      ISNULL(SUM(CreditAmount), 0) AS CreditAmount,
      ISNULL(SUM(CreditAmountOC), 0) AS CreditAmountOC,
      ISNULL(SUM(MainQuantity), 0) AS Quantity
    FROM GeneralLedger
    WHERE CorrespondingAccountNumber IS NULL
    GROUP BY LEFT(AccountNumber, 3)
    ORDER BY AccountCode

transactions:
  description: "Fallback: phát sinh gom theo ngày/tháng và tài khoản 3 số"
  query: >
    SELECT
      DAY(RefDate) + MONTH(RefDate) * 100 AS TaskID,
      LEFT(AccountNumber, 3) AS AccountCode,
      ISNULL(SUM(DebitAmount - CreditAmount), 0) AS Amount,
      ISNULL(SUM(DebitAmountOC - CreditAmountOC), 0) AS AmountOC,
      ISNULL(SUM(CASE
        WHEN LEFT(AccountNumber, 2) = '15' OR AccountNumber LIKE '511%'
        THEN MainQuantity ELSE 0 END), 0) AS Quantity
    FROM GeneralLedger
    WHERE UPPER(ISNULL(RefNo, '')) <> 'OPN'
    GROUP BY DAY(RefDate) + MONTH(RefDate) * 100, LEFT(AccountNumber, 3)
    HAVING SUM(DebitAmount - CreditAmount) <> 0
    ORDER BY TaskID, AccountCode

# -----------------------------------------------------------------------------
# Dữ liệu cấp dòng dùng cho entity resolution và workflow grading
# -----------------------------------------------------------------------------
catalog_inventory_items:
  description: "Danh mục hàng hóa; mã và tên chỉ dùng để hiển thị"
  query: >
    SELECT
      ii.InventoryItemID,
      ii.InventoryItemType,
      ii.UnitID,
      u.UnitName,
      ii.DefaultStockID,
      ii.InventoryAccount,
      ii.COGSAccount,
      ii.SaleAccount,
      ii.TaxRate,
      ii.CostMethod,
      ii.Inactive,
      ii.InventoryItemCode,
      ii.InventoryItemName
    FROM InventoryItem ii
    LEFT JOIN Unit u ON u.UnitID = ii.UnitID

opening_inventory_lines:
  description: "Số dư đầu kỳ theo mặt hàng, kho và đơn vị"
  query: >
    SELECT
      InventoryItemID,
      StockID,
      COALESCE(MainUnitID, UnitID) AS CanonicalUnitID,
      ISNULL(SUM(CASE
        WHEN MainInwardQuantity <> 0 THEN MainInwardQuantity
        ELSE InwardQuantityBalance END), 0) AS OpeningQuantity,
      ISNULL(SUM(InwardAmountBalance), 0) AS OpeningAmount,
      CASE
        WHEN SUM(CASE
          WHEN MainInwardQuantity <> 0 THEN MainInwardQuantity
          ELSE InwardQuantityBalance END) <> 0
        THEN SUM(InwardAmountBalance) /
             SUM(CASE
               WHEN MainInwardQuantity <> 0 THEN MainInwardQuantity
               ELSE InwardQuantityBalance END)
        ELSE 0
      END AS OpeningUnitPrice
    FROM InventoryLedger
    WHERE UPPER(ISNULL(RefNo, '')) = 'OPN'
    GROUP BY InventoryItemID, StockID, COALESCE(MainUnitID, UnitID)

purchase_order_lines:
  description: "Dòng đơn đặt hàng"
  query: >
    SELECT
      'PU_ORDER' AS ModuleRole,
      h.RefType,
      h.RefID,
      d.RefDetailID,
      h.RefDate,
      CAST(NULL AS datetime) AS PostedDate,
      h.AccountObjectID,
      d.InventoryItemID,
      d.StockID,
      d.UnitID,
      d.MainUnitID,
      d.Quantity,
      d.MainQuantity,
      d.UnitPrice,
      d.MainUnitPrice,
      d.Amount,
      d.VATRate,
      d.VATAmount,
      CAST(NULL AS nvarchar(20)) AS DebitAccount,
      CAST(NULL AS nvarchar(20)) AS CreditAccount,
      CAST(NULL AS uniqueidentifier) AS SourceRefID,
      CAST(NULL AS uniqueidentifier) AS SourceRefDetailID,
      CAST(NULL AS bit) AS IsPostedFinance,
      CAST(NULL AS bit) AS IsPostedInventory,
      d.QuantityReceipt,
      d.SortOrder
    FROM PUOrder h
    INNER JOIN PUOrderDetail d ON d.RefID = h.RefID

purchase_voucher_lines:
  description: "Dòng chứng từ mua hàng và liên kết đến dòng đơn đặt hàng"
  query: >
    SELECT
      'PU_VOUCHER' AS ModuleRole,
      h.RefType,
      h.RefID,
      d.RefDetailID,
      h.RefDate,
      h.PostedDate,
      h.AccountObjectID,
      d.InventoryItemID,
      d.StockID,
      d.UnitID,
      d.MainUnitID,
      d.Quantity,
      d.MainQuantity,
      d.UnitPrice,
      d.MainUnitPrice,
      d.Amount,
      d.InwardAmount,
      d.VATRate,
      d.VATAmount,
      d.DebitAccount,
      d.CreditAccount,
      d.PUOrderRefID AS SourceRefID,
      d.PUOrderRefDetailID AS SourceRefDetailID,
      CASE
        WHEN h.IsPostedFinance = 1 OR h.IsPostedManagement = 1
        THEN CAST(1 AS bit) ELSE CAST(0 AS bit)
      END AS IsPostedFinance,
      CASE
        WHEN h.IsPostedInventoryBookFinance = 1
          OR h.IsPostedInventoryBookManagement = 1
        THEN CAST(1 AS bit) ELSE CAST(0 AS bit)
      END AS IsPostedInventory
    FROM PUVoucher h
    INNER JOIN PUVoucherDetail d ON d.RefID = h.RefID

inventory_inward_lines:
  description: "Dòng phiếu nhập kho độc lập"
  query: >
    SELECT
      'IN_INWARD' AS ModuleRole,
      h.RefType,
      h.RefID,
      d.RefDetailID,
      h.RefDate,
      h.PostedDate,
      h.AccountObjectID,
      d.InventoryItemID,
      d.StockID,
      d.UnitID,
      d.MainUnitID,
      d.Quantity,
      d.MainQuantity,
      d.UnitPriceFinance,
      d.MainUnitPriceFinance,
      d.AmountFinance,
      d.DebitAccount,
      d.CreditAccount,
      d.ConfrontingRefID AS SourceRefID,
      d.ConfrontingRefDetailID AS SourceRefDetailID,
      CASE
        WHEN h.IsPostedFinance = 1 OR h.IsPostedManagement = 1
        THEN CAST(1 AS bit) ELSE CAST(0 AS bit)
      END AS IsPostedFinance,
      CASE
        WHEN h.IsPostedInventoryBookFinance = 1
          OR h.IsPostedInventoryBookManagement = 1
        THEN CAST(1 AS bit) ELSE CAST(0 AS bit)
      END AS IsPostedInventory
    FROM INInward h
    INNER JOIN INInwardDetail d ON d.RefID = h.RefID

inventory_ledger_lines:
  description: "Bút toán sổ kho theo dòng chứng từ"
  query: >
    SELECT
      RefID,
      RefDetailID,
      RefType,
      RefDate,
      PostedDate,
      InventoryItemID,
      StockID,
      UnitID,
      MainUnitID,
      UnitPrice,
      MainUnitPrice,
      InwardQuantity,
      OutwardQuantity,
      MainInwardQuantity,
      MainOutwardQuantity,
      InwardAmount,
      OutwardAmount,
      AccountNumber,
      CorrespondingAccountNumber,
      AccountObjectID,
      ConfrontingRefID,
      ConfrontingRefDetailID,
      OutwardRefID,
      OutwardRefDetailID,
      IsInward
    FROM InventoryLedger
    WHERE UPPER(ISNULL(RefNo, '')) <> 'OPN'

general_ledger_lines:
  description: "Bút toán sổ cái theo dòng chứng từ"
  query: >
    SELECT
      RefID,
      RefDetailID,
      RefType,
      RefDate,
      PostedDate,
      InventoryItemID,
      AccountObjectID,
      StockID,
      AccountNumber,
      CorrespondingAccountNumber,
      DebitAmount,
      CreditAmount,
      Quantity,
      UnitPrice,
      MainQuantity,
      MainUnitPrice,
      MainUnitID,
      UnitID,
      PUOrderRefID,
      IsPostToManagementBook
    FROM GeneralLedger
    WHERE UPPER(ISNULL(RefNo, '')) <> 'OPN'

voucher_edges:
  description: "Liên kết cấp chứng từ giữa các phân hệ"
  query: >
    SELECT
      RefID1,
      RefID2,
      RefType1,
      RefType2,
      ReferenceType,
      SortOrder
    FROM VoucherReference

# -----------------------------------------------------------------------------
# Báo cáo
# -----------------------------------------------------------------------------
financial_reports:
  description: "Bảng cân đối kế toán và báo cáo kết quả kinh doanh"
  query: >
    SELECT
      ReportType,
      ItemCode,
      ISNULL(Amount, 0) AS Amount
    FROM FRReportDetail
    WHERE ReportType IN (1, 2) AND FormulaType = 0
    ORDER BY ReportType, ItemCode

# -----------------------------------------------------------------------------
# Thông tin sinh viên
# -----------------------------------------------------------------------------
computer_name:
  description: "Danh sách máy tính làm bài từ audit log"
  query: >
    SELECT DISTINCT ComputerName
    FROM MSC_AudittingLog
    WHERE ComputerName <> 'ADMIN-D13'
      AND ComputerName IS NOT NULL
      AND ComputerName <> ''

student_info:
  description: "Thông tin tài khoản người dùng"
  query: >
    SELECT UserName, FullName, FirstName, LastName
    FROM MSC_User
    WHERE UserName <> '0983125672' AND MISAID IS NOT NULL

# -----------------------------------------------------------------------------
# Traceability tương thích cũ
# -----------------------------------------------------------------------------
trace_purchase_orders:
  query: >
    SELECT po.RefNo, po.RefDate, po.AccountObjectName, po.TotalAmount
    FROM PUOrder po
    ORDER BY po.RefDate

trace_purchase_vouchers:
  query: >
    SELECT
      ISNULL(pv.RefNoFinance, pv.RefNoManagement) AS RefNo,
      pv.RefDate,
      pv.RefType,
      pv.AccountObjectName,
      pv.TotalAmount
    FROM PUVoucher pv
    ORDER BY pv.RefDate

trace_sales_orders:
  query: >
    SELECT so.RefNo, so.RefDate, so.AccountObjectName, so.TotalAmount
    FROM SAOrder so
    ORDER BY so.RefDate

trace_sales_vouchers:
  query: >
    SELECT
      ISNULL(sv.RefNoFinance, sv.RefNoManagement) AS RefNo,
      sv.RefDate,
      sv.RefType,
      sv.AccountObjectName,
      sv.TotalAmount
    FROM SAVoucher sv
    ORDER BY sv.RefDate

trace_voucher_links:
  query: >
    SELECT
      RefID1,
      RefID2,
      RefType1,
      RefType2,
      RefNoFinance1,
      RefNoFinance2
    FROM VoucherReference

# -----------------------------------------------------------------------------
# Audit log
# -----------------------------------------------------------------------------
audit_timeline:
  query: >
    SELECT
      Time,
      LoginName,
      ComputerName,
      ComputerIP,
      ApplicationPartAlias,
      PermissionTypeAlias,
      RefType,
      Reference,
      RefID,
      Description
    FROM MSC_AudittingLog
    ORDER BY Time

audit_workflow_steps:
  query: >
    SELECT
      Time,
      ApplicationPartAlias,
      PermissionTypeAlias,
      RefType,
      Reference,
      RefID
    FROM MSC_AudittingLog
    WHERE PermissionTypeAlias IN (N'Thêm', N'Ghi sổ', N'Sửa', N'Xóa', N'Bỏ ghi')
      AND RefType > 0
    ORDER BY Time

audit_computer_forensics:
  query: >
    SELECT
      ComputerName,
      ComputerIP,
      MIN(Time) AS FirstAction,
      MAX(Time) AS LastAction,
      COUNT(*) AS ActionCount,
      COUNT(DISTINCT LoginName) AS DistinctLogins
    FROM MSC_AudittingLog
    GROUP BY ComputerName, ComputerIP

audit_process_compliance:
  query: >
    SELECT
      ApplicationPartAlias,
      PermissionTypeAlias,
      MIN(Time) AS FirstOccurrence,
      MAX(Time) AS LastOccurrence,
      COUNT(*) AS ActionCount
    FROM MSC_AudittingLog
    WHERE PermissionTypeAlias IN (N'Thêm', N'Ghi sổ')
    GROUP BY ApplicationPartAlias, PermissionTypeAlias
    ORDER BY MIN(Time)
